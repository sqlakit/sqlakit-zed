name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --tests -- -D warnings && cargo clippy --release --target wasm32-wasip2 -- -D warnings
      - name: Test
        run: cargo test
      # What Zed builds when it installs the extension.
      - name: Build
        run: cargo build --release --target wasm32-wasip2
